<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARGO · EcoVolt — Gestión Energética Inteligente</title>
  <meta name="description" content="Controla tu consumo eléctrico, ahorra en tu factura y automatiza tu hogar con inteligencia artificial. EcoVolt by ARGO." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <!-- CDN scripts -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:          #07091E;
      --bg-card:     #0C1140;
      --bg-card2:    #101550;
      --gold:        #C49A14;
      --gold-light:  #E8C040;
      --gold-dim:    rgba(196,154,20,0.18);
      --gold-border: rgba(196,154,20,0.30);
      --navy:        #1A237E;
      --navy-light:  #2535A8;
      --cream:       #F0E6C0;
      --text:        #E0D8C0;
      --text-muted:  #7A87A5;
      --border:      rgba(196,154,20,0.15);
      --green:       #10b981;
      --yellow:      #f59e0b;
      --red:         #ef4444;
    }
    body {
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 24px 0 40px;
    }
    #root { width: 100%; display: flex; justify-content: center; }
    .phone {
      width: 390px;
      min-height: 844px;
      background: var(--bg);
      border-radius: 46px;
      border: 1.5px solid rgba(196,154,20,0.25);
      box-shadow:
        0 0 0 8px #05061A,
        0 0 0 10px rgba(196,154,20,0.08),
        0 50px 100px rgba(0,0,0,0.9),
        inset 0 1px 0 rgba(196,154,20,0.12);
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .status-bar {
      background: rgba(7,9,30,0.95);
      padding: 12px 24px 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(196,154,20,0.06);
    }
    .screen {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
      padding-bottom: 82px;
    }
    .screen::-webkit-scrollbar { display: none; }
    .bottom-nav {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 74px;
      background: rgba(7,9,30,0.96);
      backdrop-filter: blur(24px);
      border-top: 1px solid var(--gold-border);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 4px 10px;
      z-index: 50;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 8px 10px; border-radius: 14px; cursor: pointer;
      transition: background 0.2s, transform 0.15s; flex: 1;
    }
    .nav-item:active { transform: scale(0.93); }
    .nav-item.active { background: var(--gold-dim); }
    .nav-item .nav-icon { font-size: 20px; transition: filter 0.2s; }
    .nav-item:not(.active) .nav-icon { filter: grayscale(0.7) opacity(0.45); }
    .nav-item .nav-label { font-size: 9.5px; font-weight: 500; color: var(--text-muted); }
    .nav-item.active .nav-label { color: var(--gold-light); }
    .toggle {
      width: 48px; height: 26px; border-radius: 13px; cursor: pointer;
      position: relative; transition: background 0.3s; flex-shrink: 0;
    }
    .toggle::after {
      content: ''; width: 20px; height: 20px; background: white;
      border-radius: 50%; position: absolute; top: 3px; left: 3px;
      transition: transform 0.3s; box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    }
    .toggle.on  { background: var(--gold); }
    .toggle.off { background: #2a3450; }
    .toggle.on::after  { transform: translateX(22px); }
    input[type=range] {
      -webkit-appearance: none; width: 100%; height: 4px;
      border-radius: 2px; background: #2a3450; outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 18px; height: 18px;
      border-radius: 50%; background: var(--gold); cursor: pointer;
      box-shadow: 0 0 0 4px rgba(196,154,20,0.25);
    }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 16px;
    }
    .chip {
      padding: 6px 12px; border-radius: 20px; font-size: 11px;
      font-weight: 500; cursor: pointer; transition: all 0.18s;
      border: 1px solid rgba(255,255,255,0.08); white-space: nowrap;
      background: rgba(255,255,255,0.04); color: var(--text-muted);
    }
    .chip.on { background: var(--gold); color: #07091E; border-color: var(--gold); font-weight: 700; }
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 9px; border-radius: 999px; font-size: 10.5px; font-weight: 600;
    }
    .badge-gold   { background: rgba(196,154,20,0.18); color: var(--gold-light); }
    .badge-green  { background: rgba(16,185,129,0.15); color: #34d399; }
    .badge-red    { background: rgba(239,68,68,0.15);  color: #f87171; }
    .badge-yellow { background: rgba(245,158,11,0.15); color: #fcd34d; }
    .ef { padding: 1px 7px; border-radius: 5px; font-size: 10.5px; font-weight: 800; letter-spacing: .05em; }
    .ef-A { background:#10b981; color:#fff; } .ef-B { background:#34d399; color:#064e3b; }
    .ef-C { background:#86efac; color:#065f46; } .ef-D { background:#fbbf24; color:#78350f; }
    .ef-E { background:#f97316; color:#fff; } .ef-F { background:#ef4444; color:#fff; }
    .ef-G { background:#dc2626; color:#fff; }
    .fade-in { animation: fi .3s ease both; }
    @keyframes fi { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .pulse { animation: p 2s infinite; }
    @keyframes p { 0%,100%{opacity:1} 50%{opacity:.4} }
    .spin { animation: spin .9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn-gold {
      background: var(--gold); color: #07091E; font-weight: 700; font-size: 12.5px;
      padding: 11px; border-radius: 12px; border: none; cursor: pointer;
      width: 100%; transition: background .2s, transform .15s;
    }
    .btn-gold:hover { background: var(--gold-light); }
    .btn-gold:active { transform: scale(0.97); }
    .btn-outline {
      background: rgba(196,154,20,0.08); color: var(--gold); font-weight: 600; font-size: 12px;
      padding: 10px; border-radius: 12px; border: 1px solid var(--gold-border); cursor: pointer;
      width: 100%; transition: background .2s;
    }
    @media (max-width: 430px) {
      body { padding: 0; }
      .phone { border-radius: 0; border: none; box-shadow: none; min-height: 100vh; width: 100%; }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

/* Precios 24h PVPC 2.0TD */
const precios24hPVPC = [
  {h:'00h',p:0.078,n:0},{h:'01h',p:0.065,n:1},{h:'02h',p:0.058,n:2},{h:'03h',p:0.042,n:3},
  {h:'04h',p:0.038,n:4},{h:'05h',p:0.044,n:5},{h:'06h',p:0.062,n:6},{h:'07h',p:0.085,n:7},
  {h:'08h',p:0.118,n:8},{h:'09h',p:0.142,n:9},{h:'10h',p:0.158,n:10},{h:'11h',p:0.172,n:11},
  {h:'12h',p:0.185,n:12},{h:'13h',p:0.168,n:13},{h:'14h',p:0.145,n:14},{h:'15h',p:0.132,n:15},
  {h:'16h',p:0.128,n:16},{h:'17h',p:0.148,n:17},{h:'18h',p:0.195,n:18},{h:'19h',p:0.208,n:19},
  {h:'20h',p:0.198,n:20},{h:'21h',p:0.182,n:21},{h:'22h',p:0.148,n:22},{h:'23h',p:0.112,n:23},
];

const preciosLibre3Tramos = precios24hPVPC.map(item => {
  const h = item.n;
  let p = 0.120;
  if (h >= 0 && h < 8) p = 0.085;
  else if ((h >= 10 && h < 14) || (h >= 18 && h < 22)) p = 0.190;
  return { ...item, p };
});

const preciosLibrePlano = precios24hPVPC.map(item => ({ ...item, p: 0.138 }));

const pBand = p => {
  if (p < 0.095) return { label: 'Valle · Muy Barato', color: '#10b981', bg: 'rgba(16,185,129,0.1)' };
  if (p < 0.155) return { label: 'Llano · Moderado', color: '#f59e0b', bg: 'rgba(245,158,11,0.1)' };
  return { label: 'Punta · Evitar uso', color: '#ef4444', bg: 'rgba(239,68,68,0.1)' };
};

const aparatos = [
  {id:1, n:'Lavadora 40°C', e:'🫧', w:1400, h:1.5},
  {id:2, n:'Lavavajillas ECO', e:'🍽️', w:1200, h:2.0},
  {id:3, n:'Secadora Bomba', e:'🌀', w:2200, h:1.5},
  {id:4, n:'Horno Eléctrico', e:'🔥', w:2400, h:1.0},
  {id:5, n:'Coche Eléctrico', e:'⚡', w:7400, h:4.0},
  {id:6, n:'Termo Eléctrico', e:'🚿', w:1500, h:2.5},
];

const factura = {
  total: 68.42, periodo: '01 oct – 31 oct 2026',
  potencia: { kw: 4.6, coste: 24.18 }, energia: { kwh: 185, coste: 34.72 },
  impuestos: { coste: 9.52 }, picoPotencia: 3.1
};

const hogar = [
  {id:1, n:'Frigorífico Combi', año:2008, cl:'G', kwh:480, ico:'🧊'},
  {id:2, n:'Lavadora', año:2012, cl:'F', kwh:285, ico:'🫧'},
  {id:3, n:'Lavavajillas', año:2015, cl:'C', kwh:240, ico:'🍽️'},
  {id:4, n:'Televisor 55"', año:2018, cl:'C', kwh:180, ico:'📺'},
  {id:5, n:'Horno eléctrico', año:2010, cl:'G', kwh:320, ico:'🔥'},
  {id:6, n:'Aire acondicionado', año:2014, cl:'F', kwh:520, ico:'❄️'},
];

const factorClase = { A: 0.25, B: 0.35, C: 0.50, D: 0.65, E: 0.75 };

const feedIA = [
  {t:'03:15 AM', a:'Termo eléctrico encendido', r:'Aprovechando precio mínimo 0.038 €/kWh. Tarifa valle activa.', tipo:'on', s:0.42},
  {t:'05:30 AM', a:'Termo apagado', r:'Agua a 60°C. Completado antes del tramo caro.', tipo:'off', s:0},
  {t:'08:00 AM', a:'Lavadora cancelada', r:'Precio subió a 0.118 €/kWh. Reprogramada para las 03:00 AM del martes.', tipo:'err', s:0.31},
  {t:'11:00 AM', a:'Climatización pausada', r:'Pico punta detectado (0.172 €/kWh). Reanudación prevista 16:00h.', tipo:'err', s:0.58},
  {t:'02:00 PM', a:'Paneles solares activos', r:'Generando 2.4 kWh. Autoconsumo 100%. Excedente 0.3 kWh volcado a red.', tipo:'sun', s:0},
];

const ArgoLogoMono = ({ size = 36 }) => (
  <svg width={size} height={size} viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
    {/* Contenedor cuadrado redondeado */}
    <rect width="40" height="40" rx="10" fill="#0C1140" stroke="rgba(196,154,20,0.3)" strokeWidth="1.2" />
    {/* Rayo estilizado y limpio en dorado con brillo esmeralda */}
    <path 
      d="M22 6L11 22H20L18 34L29 18H20L22 6Z" 
      fill="#E8C040" 
      stroke="#10b981" 
      strokeWidth="0.8" 
      strokeLinejoin="round" 
    />
  </svg>
);

/* ══════════════════════════════════════════════════════════
   DONUT & BAR CHART COMPONENTS
   ══════════════════════════════════════════════════════════ */
const DonutChart = ({ segments }) => {
  const ref = useRef(null);
  const inst = useRef(null);
  useEffect(() => {
    if (!ref.current || typeof Chart === 'undefined') return;
    if (inst.current) { inst.current.destroy(); inst.current = null; }
    const ctx = ref.current.getContext('2d');
    inst.current = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: segments.map(s => s.label),
        datasets: [{ data: segments.map(s => s.v), backgroundColor: segments.map(s => s.c), borderWidth: 0, hoverOffset: 6 }]
      },
      options: {
        cutout: '68%', responsive: true, maintainAspectRatio: true,
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#0C1140', borderColor: 'rgba(196,154,20,0.3)', borderWidth: 1,
            titleColor: '#7A87A5', bodyColor: '#E0D8C0',
            callbacks: { label: c => `  ${c.parsed.toFixed(2)} €` }
          }
        }
      }
    });
    return () => { if (inst.current) { inst.current.destroy(); inst.current = null; } };
  }, [segments]);
  return <canvas ref={ref} style={{ maxHeight: 130 }} />;
};

const BarChart24h = ({ dataset, currentHour, highlightedHour }) => {
  const ref = useRef(null);
  const inst = useRef(null);

  useEffect(() => {
    if (!ref.current || typeof Chart === 'undefined') return;
    if (inst.current) { inst.current.destroy(); inst.current = null; }
    
    const ctx = ref.current.getContext('2d');
    inst.current = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: dataset.map(d => d.h),
        datasets: [{
          data: dataset.map(d => d.p),
          backgroundColor: dataset.map((d, i) => {
            if (highlightedHour !== null && i === highlightedHour) return '#E8C040';
            if (i === currentHour) return '#38bdf8';
            return d.p < 0.095 ? 'rgba(16,185,129,0.7)' : d.p < 0.155 ? 'rgba(245,158,11,0.7)' : 'rgba(239,68,68,0.7)';
          }),
          borderRadius: 4,
          borderSkipped: false,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: {
            grid: { display: false },
            border: { display: false },
            ticks: {
              color: '#7A87A5',
              font: { size: 8 },
              callback: (_, i) => (i % 4 === 0 ? dataset[i].h : '')
            }
          },
          y: {
            grid: { color: 'rgba(255,255,255,0.05)' },
            border: { display: false },
            ticks: {
              color: '#7A87A5',
              font: { size: 8 },
              callback: v => `${v.toFixed(2)} €`
            }
          }
        },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#0C1140',
            borderColor: 'rgba(196,154,20,0.3)',
            borderWidth: 1,
            titleColor: '#7A87A5',
            bodyColor: '#E0D8C0',
            callbacks: {
              title: items => `Hora: ${items[0].label}`,
              label: item => ` ${item.raw.toFixed(3)} €/kWh`
            }
          }
        }
      }
    });

    return () => { if (inst.current) { inst.current.destroy(); inst.current = null; } };
  }, [dataset, currentHour, highlightedHour]);

  return <canvas ref={ref} style={{ height: 160 }} />;
};

/* ══════════════════════════════════════════════════════════
   TAB 1 — MI FACTURA (COMPLETO CON EXPLICACIONES Y ARGO)
   ══════════════════════════════════════════════════════════ */
const TabFactura = () => {
  const [estado, setEstado] = useState('idle');
  const segmentos = [
    { label:'Potencia',  v:factura.potencia.coste,  c:'#1A237E' },
    { label:'Energía',   v:factura.energia.coste,   c:'#C49A14' },
    { label:'Impuestos', v:factura.impuestos.coste, c:'#8B6610' },
  ];

  return (
    <div style={{ padding:'16px', display:'flex', flexDirection:'column', gap:14 }} className="fade-in">
      {/* Header */}
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', paddingTop:6 }}>
        <div>
          <h1 style={{ color:'var(--cream)', fontSize:20, fontWeight:700, fontFamily:"'Cinzel',serif", letterSpacing:'.04em' }}>Mi Factura</h1>
          <p style={{ color:'var(--text-muted)', fontSize:11, marginTop:2 }}>Análisis inteligente · PVPC 2.0TD</p>
        </div>
        <span className="badge badge-gold">📄 Iberdrola</span>
      </div>

      {/* Zona de subida */}
      {estado === 'idle' && (
        <div style={{ background:'var(--bg-card)', border:'1.5px dashed var(--gold-border)', borderRadius:20, padding:'28px 20px', textAlign:'center' }}>
          <div style={{ width:56, height:56, background:'var(--gold-dim)', borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center', margin:'0 auto 12px', fontSize:26 }}>📄</div>
          <p style={{ color:'var(--cream)', fontWeight:600, fontSize:13, marginBottom:4 }}>Sube tu factura eléctrica</p>
          <p style={{ color:'var(--text-muted)', fontSize:11, marginBottom:14 }}>JPG · PNG · PDF — máx 10 MB</p>
          <button className="btn-gold" style={{ marginBottom:8 }} onClick={() => { setEstado('loading'); setTimeout(() => setEstado('done'), 1400); }}>📤 Subir foto de factura</button>
          <button className="btn-outline" onClick={() => setEstado('done')}>Ver factura de ejemplo (Iberdrola)</button>
        </div>
      )}

      {/* Cargando */}
      {estado === 'loading' && (
        <div style={{ background:'var(--bg-card)', borderRadius:20, padding:32, textAlign:'center', border:'1px solid var(--border)' }}>
          <div style={{ width:44, height:44, border:'3px solid var(--gold-dim)', borderTopColor:'var(--gold)', borderRadius:'50%', margin:'0 auto 14px' }} className="spin"/>
          <p style={{ color:'var(--cream)', fontWeight:600, fontSize:13 }}>Analizando con IA…</p>
          <p style={{ color:'var(--text-muted)', fontSize:11, marginTop:4 }}>Leyendo términos de potencia y tramos de energía</p>
        </div>
      )}

      {/* Desglose Completo */}
      {estado === 'done' && (
        <>
          <div style={{ background:'linear-gradient(135deg, rgba(26,35,126,0.5) 0%, rgba(196,154,20,0.12) 100%)', border:'1px solid var(--gold-border)', borderRadius:20, padding:16 }}>
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start' }}>
              <div>
                <p style={{ color:'var(--text-muted)', fontSize:10, textTransform:'uppercase', letterSpacing:'.08em' }}>Total a pagar</p>
                <p style={{ color:'var(--cream)', fontSize:38, fontWeight:800, lineHeight:1.1, fontFamily:"'Cinzel',serif" }}>
                  {factura.total.toFixed(2)}<span style={{ fontSize:18, color:'var(--gold)' }}> €</span>
                </p>
                <p style={{ color:'var(--text-muted)', fontSize:11, marginTop:4 }}>📅 {factura.periodo}</p>
              </div>
              <span className="badge badge-gold">Octubre 2026</span>
            </div>
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10, marginTop:12 }}>
              <div style={{ background:'rgba(0,0,0,0.25)', borderRadius:12, padding:'8px 10px' }}>
                <p style={{ color:'var(--text-muted)', fontSize:9.5 }}>Energía consumida</p>
                <p style={{ color:'var(--cream)', fontWeight:700, fontSize:13.5 }}>{factura.energia.kwh} kWh</p>
              </div>
              <div style={{ background:'rgba(0,0,0,0.25)', borderRadius:12, padding:'8px 10px' }}>
                <p style={{ color:'var(--text-muted)', fontSize:9.5 }}>Potencia contratada</p>
                <p style={{ color:'var(--cream)', fontWeight:700, fontSize:13.5 }}>{factura.potencia.kw} kW</p>
              </div>
            </div>
          </div>

          {/* Gráfico Donut y Leyenda */}
          <div className="card">
            <p style={{ color:'var(--cream)', fontWeight:600, fontSize:13, marginBottom:2 }}>¿En qué se va tu dinero?</p>
            <p style={{ color:'var(--text-muted)', fontSize:11, marginBottom:12 }}>Desglose de los importes facturados</p>
            <div style={{ display:'flex', alignItems:'center', gap:14 }}>
              <div style={{ width:120, flexShrink:0 }}>
                <DonutChart segments={segmentos} />
              </div>
              <div style={{ flex:1, display:'flex', flexDirection:'column', gap:8 }}>
                {[
                  { c:'#1A237E', n:'Potencia', v:factura.potencia.coste, d:'Por tener luz disponible' },
                  { c:'#C49A14', n:'Energía', v:factura.energia.coste, d:'Lo consumido por aparatos' },
                  { c:'#8B6610', n:'Impuestos', v:factura.impuestos.coste, d:'IVA, contador y otros' },
                ].map(x => (
                  <div key={x.n} style={{ display:'flex', alignItems:'flex-start', gap:8 }}>
                    <span style={{ width:9, height:9, borderRadius:'50%', background:x.c, flexShrink:0, marginTop:3 }}/>
                    <div style={{ flex:1 }}>
                      <div style={{ display:'flex', justifyContent:'space-between' }}>
                        <span style={{ color:'var(--cream)', fontSize:11, fontWeight:500 }}>{x.n}</span>
                        <strong style={{ color:'var(--cream)', fontSize:11.5 }}>{x.v.toFixed(2)} €</strong>
                      </div>
                      <p style={{ color:'var(--text-muted)', fontSize:9.5 }}>{x.d}</p>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>

          {/* 3 Bloques Explicativos de Factura */}
          {[
            { e:'🏠', t:'Lo que pagas por tener luz disponible', d:`Tienes ${factura.potencia.kw} kW contratados. Coste fijo mensual aunque no gastes nada.`, v:factura.potencia.coste, bc:'rgba(26,35,126,0.25)', bb:'rgba(26,35,126,0.5)' },
            { e:'💡', t:'Lo que gastaron realmente tus aparatos', d:`${factura.energia.kwh} kWh consumidos. Calculado con tarifa PVPC 2.0TD.`, v:factura.energia.coste, bc:'rgba(196,154,20,0.1)', bb:'rgba(196,154,20,0.3)' },
            { e:'🏛️', t:'Impuestos y alquiler obligatorios', d:'IVA 21% + Impuesto Eléctrico 5.11% + Alquiler del contador telegestionado.', v:factura.impuestos.coste, bc:'rgba(139,102,16,0.2)', bb:'rgba(139,102,16,0.4)' },
          ].map(b => (
            <div key={b.t} style={{ background:b.bc, border:`1px solid ${b.bb}`, borderRadius:14, padding:12, display:'flex', gap:10 }}>
              <span style={{ fontSize:22 }}>{b.e}</span>
              <div style={{ flex:1 }}>
                <div style={{ display:'flex', justifyContent:'space-between', gap:6 }}>
                  <p style={{ color:'var(--cream)', fontSize:11.5, fontWeight:600, lineHeight:1.3 }}>{b.t}</p>
                  <p style={{ color:'var(--gold-light)', fontSize:13.5, fontWeight:800, flexShrink:0 }}>{b.v.toFixed(2)} €</p>
                </div>
                <p style={{ color:'var(--text-muted)', fontSize:10.5, marginTop:3, lineHeight:1.4 }}>{b.d}</p>
              </div>
            </div>
          ))}

          {/* Diagnóstico ARGO */}
          <div style={{ background:'rgba(196,154,20,0.08)', border:'1.5px solid rgba(196,154,20,0.35)', borderRadius:18, padding:14 }}>
            <div style={{ display:'flex', gap:10 }}>
              <div style={{ width:34, height:34, background:'var(--gold-dim)', borderRadius:10, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, fontSize:16 }}>⚠️</div>
              <div>
                <p style={{ color:'var(--gold)', fontSize:10, fontWeight:700, textTransform:'uppercase', letterSpacing:'.1em' }}>Diagnóstico ARGO</p>
                <p style={{ color:'var(--cream)', fontSize:12.5, fontWeight:700, marginTop:3 }}>Estás pagando de más en potencia</p>
                <p style={{ color:'var(--text)', fontSize:11, marginTop:4, lineHeight:1.5 }}>
                  Tu pico máximo este mes fue de <strong style={{color:'var(--cream)'}}>{factura.picoPotencia} kW</strong> y tienes contratados <strong style={{color:'var(--cream)'}}>{factura.potencia.kw} kW</strong>. Bajando tu potencia contratada mantendrás el mismo confort sin saltos de plomo.
                </p>
                <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:8, marginTop:10 }}>
                  <div style={{ background:'rgba(0,0,0,0.3)', borderRadius:10, padding:'7px 10px', textAlign:'center' }}>
                    <p style={{ color:'var(--text-muted)', fontSize:9 }}>Ahorro estimado</p>
                    <p style={{ color:'var(--gold-light)', fontSize:13.5, fontWeight:800 }}>~72 €/año</p>
                  </div>
                  <button className="btn-gold" style={{ fontSize:10.5, padding:'7px 10px', borderRadius:10 }}>Solicitar bajada</button>
                </div>
              </div>
            </div>
          </div>

          <button onClick={() => setEstado('idle')} style={{ color:'var(--text-muted)', fontSize:11, background:'none', border:'none', cursor:'pointer', padding:'4px 0' }}>
            ← Analizar otra factura
          </button>
        </>
      )}
    </div>
  );
};

/* ══════════════════════════════════════════════════════════
   TAB 2 — HORAS BARATAS
   ══════════════════════════════════════════════════════════ */
const TabHorasBaratas = () => {
  const [tarifaTipo, setTarifaTipo] = useState('pvpc');
  const [selAp, setSelAp] = useState(1);
  const [horaSimulada, setHoraSimulada] = useState(null);
  const [recordatorios, setRecordatorios] = useState({});
  const [alertaAnticipacion, setAlertaAnticipacion] = useState(30);
  const [showTarifaModal, setShowTarifaModal] = useState(false);
  const [notifGuardada, setNotifGuardada] = useState(false);

  const [horaReal, setHoraReal] = useState(() => new Date().getHours());
  const [minReal, setMinReal] = useState(() => new Date().getMinutes());

  useEffect(() => {
    const t = setInterval(() => {
      const n = new Date();
      setHoraReal(n.getHours());
      setMinReal(n.getMinutes());
    }, 15000);
    return () => clearInterval(t);
  }, []);

  const datasetActivo = useMemo(() => {
    if (tarifaTipo === 'libre_tramos') return preciosLibre3Tramos;
    if (tarifaTipo === 'libre_plano') return preciosLibrePlano;
    return precios24hPVPC;
  }, [tarifaTipo]);

  const precioActual = datasetActivo[horaReal]?.p || 0.12;
  const bandActual = pBand(precioActual);
  const timeLabel = `${String(horaReal).padStart(2,'0')}:${String(minReal).padStart(2,'0')}h`;

  const preciosOrdenados = useMemo(() => [...datasetActivo].sort((a, b) => a.p - b.p), [datasetActivo]);
  const top5Baratas = preciosOrdenados.slice(0, 5);
  const top3Caras = [...datasetActivo].sort((a, b) => b.p - a.p).slice(0, 3);
  const minPrecio = top5Baratas[0];
  const maxPrecio = top3Caras[0];
  const mediaDia = (datasetActivo.reduce((acc, x) => acc + x.p, 0) / 24).toFixed(3);

  const aparatoActivo = aparatos.find(a => a.id === selAp) || aparatos[0];

  const calcularCosteEnHora = (hInicio) => {
    const horasDuracion = aparatoActivo.h;
    const kwPotencia = aparatoActivo.w / 1000;
    let costeTotal = 0;
    let horasRestantes = horasDuracion;
    let hCursor = hInicio;

    while (horasRestantes > 0) {
      const fraccion = Math.min(1, horasRestantes);
      const precioH = datasetActivo[hCursor % 24].p;
      costeTotal += kwPotencia * fraccion * precioH;
      horasRestantes -= fraccion;
      hCursor++;
    }
    return costeTotal;
  };

  const mejorVentana = useMemo(() => {
    let mejorH = 0;
    let menorCoste = Infinity;
    for (let h = 0; h < 24; h++) {
      const c = calcularCosteEnHora(h);
      if (c < menorCoste) {
        menorCoste = c;
        mejorH = h;
      }
    }
    return { hora: mejorH, coste: menorCoste };
  }, [aparatoActivo, datasetActivo]);

  const horaEvaluada = horaSimulada !== null ? horaSimulada : horaReal;
  const costeEvaluado = calcularCosteEnHora(horaEvaluada);
  const costeMejor = mejorVentana.coste;

  const programarAviso = () => {
    setRecordatorios(prev => ({
      ...prev,
      [aparatoActivo.id]: {
        hora: mejorVentana.hora,
        anticipacion: alertaAnticipacion,
        aparato: aparatoActivo.n
      }
    }));
    setNotifGuardada(true);
    setTimeout(() => setNotifGuardada(false), 2600);
  };

  return (
    <div style={{ padding: '16px', display: 'flex', flexDirection: 'column', gap: 14 }} className="fade-in">
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', paddingTop: 6 }}>
        <div>
          <h1 style={{ color: 'var(--cream)', fontSize: 20, fontWeight: 700, fontFamily: "'Cinzel', serif", letterSpacing: '.04em' }}>Horas Baratas</h1>
          <p style={{ color: 'var(--text-muted)', fontSize: 11, marginTop: 2 }}>Optimizador de electrodomésticos</p>
        </div>
        <button
          onClick={() => setShowTarifaModal(v => !v)}
          style={{ background: 'var(--gold-dim)', border: '1px solid var(--gold-border)', color: 'var(--gold-light)', borderRadius: 12, padding: '5px 10px', fontSize: 10.5, fontWeight: 700, cursor: 'pointer' }}>
          ⚙️ {tarifaTipo === 'pvpc' ? 'PVPC Regulado' : tarifaTipo === 'libre_tramos' ? 'Libre 3 Tramos' : 'Libre Fijo'}
        </button>
      </div>

      {showTarifaModal && (
        <div style={{ background: 'var(--bg-card2)', border: '1px solid var(--gold-border)', borderRadius: 16, padding: 14, display: 'flex', flexDirection: 'column', gap: 8 }} className="fade-in">
          <p style={{ color: 'var(--cream)', fontSize: 12, fontWeight: 700 }}>Tipo de tarifa eléctrica:</p>
          {[
            { id: 'pvpc', t: 'PVPC Regulado (2.0TD)', d: 'Precio cambia cada hora según OMIE/REE.' },
            { id: 'libre_tramos', t: 'Mercado Libre (3 tramos)', d: 'Precio fijo en Valle, Llano y Punta.' },
            { id: 'libre_plano', t: 'Mercado Libre (Precio Plano)', d: 'Mismo precio 24h.' },
          ].map(op => (
            <div
              key={op.id}
              onClick={() => { setTarifaTipo(op.id); setShowTarifaModal(false); }}
              style={{ padding: '8px 10px', borderRadius: 10, cursor: 'pointer', background: tarifaTipo === op.id ? 'var(--gold-dim)' : 'rgba(0,0,0,0.25)', border: `1px solid ${tarifaTipo === op.id ? 'var(--gold)' : 'transparent'}` }}>
              <p style={{ color: tarifaTipo === op.id ? 'var(--gold-light)' : 'var(--cream)', fontSize: 11.5, fontWeight: 600 }}>{op.t}</p>
              <p style={{ color: 'var(--text-muted)', fontSize: 10 }}>{op.d}</p>
            </div>
          ))}
        </div>
      )}

      {/* Semáforo */}
      <div style={{ background: bandActual.bg, border: `1.5px solid ${bandActual.color}40`, borderRadius: 20, padding: 16 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 2 }}>
              <span style={{ color: bandActual.color, fontSize: 11, fontWeight: 800, textTransform: 'uppercase', letterSpacing: '.08em' }}>{bandActual.label}</span>
              <span style={{ color: 'var(--text-muted)', fontSize: 10 }}>· {timeLabel}</span>
            </div>
            <p style={{ color: 'var(--cream)', fontSize: 38, fontWeight: 800, lineHeight: 1.1 }}>
              {precioActual.toFixed(3)}<span style={{ fontSize: 15, color: 'var(--text-muted)', fontWeight: 400 }}> €/kWh</span>
            </p>
          </div>
          <div style={{ position: 'relative' }}>
            <div style={{ width: 56, height: 56, borderRadius: '50%', background: `${bandActual.color}20`, border: `3px solid ${bandActual.color}`, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 26 }}>
              {precioActual < 0.095 ? '🟢' : precioActual < 0.155 ? '🟡' : '🔴'}
            </div>
            <div style={{ position: 'absolute', top: -1, right: -1, width: 11, height: 11, borderRadius: '50%', background: bandActual.color }} className="pulse"/>
          </div>
        </div>

        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 8, marginTop: 14 }}>
          <div style={{ background: 'rgba(0,0,0,0.3)', borderRadius: 12, padding: '8px 10px', textAlign: 'center' }}>
            <p style={{ color: 'var(--text-muted)', fontSize: 9.5 }}>Mínimo hoy</p>
            <p style={{ color: '#34d399', fontWeight: 800, fontSize: 13 }}>{minPrecio.p.toFixed(3)}€</p>
            <p style={{ color: 'var(--text-muted)', fontSize: 9 }}>a las {minPrecio.h}</p>
          </div>
          <div style={{ background: 'rgba(0,0,0,0.3)', borderRadius: 12, padding: '8px 10px', textAlign: 'center' }}>
            <p style={{ color: 'var(--text-muted)', fontSize: 9.5 }}>Media 24h</p>
            <p style={{ color: 'var(--cream)', fontWeight: 800, fontSize: 13 }}>{mediaDia}€</p>
            <p style={{ color: 'var(--text-muted)', fontSize: 9 }}>Tarifa base</p>
          </div>
          <div style={{ background: 'rgba(0,0,0,0.3)', borderRadius: 12, padding: '8px 10px', textAlign: 'center' }}>
            <p style={{ color: 'var(--text-muted)', fontSize: 9.5 }}>Máximo hoy</p>
            <p style={{ color: '#f87171', fontWeight: 800, fontSize: 13 }}>{maxPrecio.p.toFixed(3)}€</p>
            <p style={{ color: 'var(--text-muted)', fontSize: 9 }}>a las {maxPrecio.h}</p>
          </div>
        </div>
      </div>

      {/* Gráfico 24h */}
      <div className="card">
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 }}>
          <p style={{ color: 'var(--cream)', fontSize: 13, fontWeight: 600 }}>Curva horaria de precios</p>
          <span style={{ fontSize: 10, color: 'var(--gold-light)' }}>
            {horaSimulada !== null ? `Viendo: ${horaSimulada}:00h` : `Ahora: ${timeLabel}`}
          </span>
        </div>
        <div style={{ height: 160 }}>
          <BarChart24h
            dataset={datasetActivo}
            currentHour={horaReal}
            highlightedHour={horaSimulada !== null ? horaSimulada : mejorVentana.hora}
          />
        </div>
      </div>

      {/* Planificador de Electrodomésticos */}
      <div className="card" style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
        <div>
          <p style={{ color: 'var(--cream)', fontSize: 13, fontWeight: 700 }}>Planificador de electrodomésticos</p>
          <p style={{ color: 'var(--text-muted)', fontSize: 11, marginTop: 2 }}>Calcula la ventana consecutiva más barata</p>
        </div>

        <div style={{ display: 'flex', gap: 6, overflowX: 'auto', paddingBottom: 4 }}>
          {aparatos.map(ap => (
            <button
              key={ap.id}
              className={`chip ${selAp === ap.id ? 'on' : ''}`}
              onClick={() => { setSelAp(ap.id); setHoraSimulada(null); }}>
              {ap.e} {ap.n}
            </button>
          ))}
        </div>

        <div style={{ background: 'rgba(0,0,0,0.3)', borderRadius: 14, padding: 12, display: 'flex', flexDirection: 'column', gap: 10 }}>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}>
            <div style={{ background: 'rgba(239,68,68,0.08)', border: '1px solid rgba(239,68,68,0.25)', borderRadius: 12, padding: 10 }}>
              <p style={{ color: 'var(--text-muted)', fontSize: 9.5, textTransform: 'uppercase' }}>Si lo pones ahora ({timeLabel})</p>
              <p style={{ color: '#f87171', fontSize: 18, fontWeight: 800, marginTop: 2 }}>{calcularCosteEnHora(horaReal).toFixed(3)} €</p>
            </div>
            <div style={{ background: 'rgba(16,185,129,0.08)', border: '1px solid rgba(16,185,129,0.25)', borderRadius: 12, padding: 10 }}>
              <p style={{ color: 'var(--text-muted)', fontSize: 9.5, textTransform: 'uppercase' }}>Mejor hora ({mejorVentana.hora}:00h)</p>
              <p style={{ color: '#34d399', fontSize: 18, fontWeight: 800, marginTop: 2 }}>{costeMejor.toFixed(3)} €</p>
            </div>
          </div>

          <div style={{ background: 'var(--gold-dim)', border: '1px solid var(--gold-border)', borderRadius: 12, padding: '10px 12px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <div>
              <p style={{ color: 'var(--gold-light)', fontSize: 11, fontWeight: 700 }}>Ahorro directo</p>
              <p style={{ color: 'var(--cream)', fontSize: 19, fontWeight: 800 }}>
                {(calcularCosteEnHora(horaReal) - costeMejor).toFixed(3)} €
              </p>
            </div>
            <div style={{ textAlign: 'right' }}>
              <span className="badge badge-green">Recomendado</span>
              <p style={{ color: 'var(--cream)', fontSize: 11, fontWeight: 600, marginTop: 4 }}>
                De {mejorVentana.hora}:00h a {Math.floor(mejorVentana.hora + aparatoActivo.h)}:00h
              </p>
            </div>
          </div>

          <div>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 4 }}>
              <p style={{ color: 'var(--text)', fontSize: 11, fontWeight: 500 }}>Probar otra hora de inicio:</p>
              <span style={{ color: 'var(--gold-light)', fontSize: 11, fontWeight: 700 }}>
                {horaEvaluada}:00h → {costeEvaluado.toFixed(3)} €
              </span>
            </div>
            <input
              type="range" min="0" max="23" step="1"
              value={horaEvaluada}
              onChange={e => setHoraSimulada(parseInt(e.target.value))}
            />
          </div>

          <div style={{ borderTop: '1px solid rgba(255,255,255,0.08)', paddingTop: 10, display: 'flex', flexDirection: 'column', gap: 8 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <p style={{ color: 'var(--cream)', fontSize: 11, fontWeight: 600 }}>Anticipación de aviso:</p>
              <div style={{ display: 'flex', gap: 4 }}>
                {[15, 30, 60].map(m => (
                  <button
                    key={m}
                    onClick={() => setAlertaAnticipacion(m)}
                    style={{
                      background: alertaAnticipacion === m ? 'var(--gold)' : 'rgba(255,255,255,0.06)',
                      color: alertaAnticipacion === m ? '#07091E' : 'var(--text-muted)',
                      border: 'none', borderRadius: 6, padding: '2px 7px', fontSize: 9.5, fontWeight: 700, cursor: 'pointer'
                    }}>
                    {m}m
                  </button>
                ))}
              </div>
            </div>

            <button className="btn-gold" onClick={programarAviso}>
              {recordatorios[aparatoActivo.id] ? `✓ Alerta activa (${mejorVentana.hora}:00h - ${alertaAnticipacion}m)` : `🔔 Programar aviso para las ${mejorVentana.hora}:00h`}
            </button>
            {notifGuardada && (
              <p style={{ color: '#34d399', fontSize: 10, textAlign: 'center', fontWeight: 600 }} className="fade-in">
                ✓ Recordatorio guardado correctamente
              </p>
            )}
          </div>
        </div>
      </div>
    </div>
  );
};

/* ══════════════════════════════════════════════════════════
   TAB 3 — ELECTRODOMÉSTICOS G (CON AÑOS, BARRA Y MODELOS)
   ══════════════════════════════════════════════════════════ */
const TabElectro = () => {
  const [sel, setSel] = useState(1);
  const [claseN, setClaseN] = useState('A');
  const [precio, setPrecio] = useState(450);
  const KWH = 0.126;

  const ap = hogar.find(a => a.id === sel) || hogar[0];
  const fClase = factorClase[claseN] || 0.25;
  const kwhN = Math.round(ap.kwh * fClase);
  const ahorroKwh = ap.kwh - kwhN;
  const ahorroEur = (ahorroKwh * KWH).toFixed(2);
  const paybackY = (precio / parseFloat(ahorroEur)).toFixed(1);
  const paybackM = Math.round((precio / parseFloat(ahorroEur)) * 12);

  return (
    <div style={{ padding:'16px', display:'flex', flexDirection:'column', gap:14 }} className="fade-in">
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', paddingTop:6 }}>
        <div>
          <h1 style={{ color:'var(--cream)', fontSize:20, fontWeight:700, fontFamily:"'Cinzel',serif", letterSpacing:'.04em' }}>Electro G</h1>
          <p style={{ color:'var(--text-muted)', fontSize:11, marginTop:2 }}>Cazador de vampiros energéticos</p>
        </div>
        <span className="badge badge-red">🧛 {hogar.filter(a => a.cl==='F'||a.cl==='G').length} vampiros</span>
      </div>

      {/* Lista de Aparatos */}
      <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
        {hogar.map(item => (
          <div
            key={item.id}
            onClick={() => setSel(item.id)}
            style={{
              background: sel === item.id ? 'rgba(196,154,20,0.1)' : 'var(--bg-card)',
              border: `1px solid ${sel === item.id ? 'var(--gold-border)' : 'var(--border)'}`,
              borderRadius:14, padding:'11px 13px', display:'flex', alignItems:'center', gap:12, cursor:'pointer', transition:'all .18s'
            }}>
            <span style={{ fontSize:24 }}>{item.ico}</span>
            <div style={{ flex:1, minWidth:0 }}>
              <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                <p style={{ color:'var(--cream)', fontSize:13, fontWeight:600 }}>{item.n}</p>
                <span className={`ef ef-${item.cl}`}>{item.cl}</span>
              </div>
              <p style={{ color:'var(--text-muted)', fontSize:10.5, marginTop:2 }}>Año {item.año} · {item.kwh} kWh/año</p>
            </div>
            {(item.cl==='F' || item.cl==='G') && (
              <span style={{ fontSize:10, color:'#f87171', background:'rgba(239,68,68,0.1)', padding:'2px 8px', borderRadius:999, flexShrink:0 }}>
                🧛 Vampiro
              </span>
            )}
            {sel === item.id && (
              <div style={{ width:18, height:18, background:'var(--gold)', borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
                <svg width="9" height="9" viewBox="0 0 9 9" fill="none"><path d="M1.5 4.5l2 2 4-4" stroke="#07091E" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
              </div>
            )}
          </div>
        ))}
      </div>

      {/* Simulador de Sustitución */}
      <div className="card" style={{ display:'flex', flexDirection:'column', gap:14 }}>
        <div>
          <p style={{ color:'var(--cream)', fontSize:13, fontWeight:600 }}>Simulador de sustitución</p>
          <p style={{ color:'var(--text-muted)', fontSize:11, marginTop:2 }}>Calcula tu amortización real al cambiar el aparato</p>
        </div>

        {/* Clase nueva */}
        <div>
          <div style={{ display:'flex', justifyContent:'space-between', marginBottom:8 }}>
            <p style={{ color:'var(--text)', fontSize:11, fontWeight:500 }}>Clase del nuevo modelo</p>
            <span className={`ef ef-${claseN}`}>{claseN}</span>
          </div>
          <div style={{ display:'flex', gap:7 }}>
            {['A','B','C','D','E'].map(c => (
              <button
                key={c}
                className={`chip ${c === claseN ? 'on' : ''}`}
                style={{ flex:1, textAlign:'center', padding:'7px 0' }}
                onClick={() => setClaseN(c)}>{c}</button>
            ))}
          </div>
        </div>

        {/* Slider precio */}
        <div>
          <div style={{ display:'flex', justifyContent:'space-between', marginBottom:6 }}>
            <p style={{ color:'var(--text)', fontSize:11, fontWeight:500 }}>Precio del nuevo modelo</p>
            <p style={{ color:'var(--gold-light)', fontSize:13, fontWeight:700 }}>{precio} €</p>
          </div>
          <input type="range" min="150" max="1500" step="10" value={precio} onChange={e => setPrecio(+e.target.value)}/>
          <div style={{ display:'flex', justifyContent:'space-between', color:'var(--text-muted)', fontSize:9.5, marginTop:4 }}>
            <span>150 €</span><span>1.500 €</span>
          </div>
        </div>

        {/* Resultados y Métricas */}
        <div style={{ background:'rgba(0,0,0,0.25)', borderRadius:14, padding:12, display:'flex', flexDirection:'column', gap:10 }}>
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:8 }}>
            <div style={{ background:'rgba(239,68,68,0.08)', border:'1px solid rgba(239,68,68,0.2)', borderRadius:12, padding:12 }}>
              <p style={{ color:'var(--text-muted)', fontSize:9.5, textTransform:'uppercase' }}>Actual · Clase {ap.cl}</p>
              <p style={{ color:'#f87171', fontSize:22, fontWeight:800 }}>{ap.kwh}</p>
              <p style={{ color:'var(--text-muted)', fontSize:9.5 }}>kWh/año</p>
              <p style={{ color:'#fca5a5', fontSize:11.5, fontWeight:600, marginTop:4 }}>{(ap.kwh * KWH).toFixed(0)} €/año</p>
            </div>
            <div style={{ background:'rgba(16,185,129,0.08)', border:'1px solid rgba(16,185,129,0.2)', borderRadius:12, padding:12 }}>
              <p style={{ color:'var(--text-muted)', fontSize:9.5, textTransform:'uppercase' }}>Nuevo · Clase {claseN}</p>
              <p style={{ color:'#34d399', fontSize:22, fontWeight:800 }}>{kwhN}</p>
              <p style={{ color:'var(--text-muted)', fontSize:9.5 }}>kWh/año</p>
              <p style={{ color:'#6ee7b7', fontSize:11.5, fontWeight:600, marginTop:4 }}>{(kwhN * KWH).toFixed(0)} €/año</p>
            </div>
          </div>

          <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:8 }}>
            <div style={{ background:'rgba(0,0,0,0.3)', borderRadius:12, padding:'8px 10px', textAlign:'center' }}>
              <p style={{ color:'var(--text-muted)', fontSize:9.5 }}>Ahorro kWh</p>
              <p style={{ color:'#93c5fd', fontWeight:800, fontSize:14 }}>{ahorroKwh}</p>
              <p style={{ color:'var(--text-muted)', fontSize:9 }}>kWh/año</p>
            </div>
            <div style={{ background:'rgba(0,0,0,0.3)', borderRadius:12, padding:'8px 10px', textAlign:'center' }}>
              <p style={{ color:'var(--text-muted)', fontSize:9.5 }}>Ahorro €</p>
              <p style={{ color:'var(--gold-light)', fontWeight:800, fontSize:14 }}>{ahorroEur} €</p>
              <p style={{ color:'var(--text-muted)', fontSize:9 }}>al año</p>
            </div>
            <div style={{ background:'rgba(0,0,0,0.3)', borderRadius:12, padding:'8px 10px', textAlign:'center' }}>
              <p style={{ color:'var(--text-muted)', fontSize:9.5 }}>Amortización</p>
              <p style={{ color:'#fcd34d', fontWeight:800, fontSize:14 }}>{paybackY} años</p>
              <p style={{ color:'var(--text-muted)', fontSize:9 }}>({paybackM} meses)</p>
            </div>
          </div>

          {/* Barra de Reducción */}
          <div>
            <div style={{ display:'flex', justifyContent:'space-between', marginBottom:4 }}>
              <span style={{ color:'var(--text-muted)', fontSize:10.5 }}>Reducción de consumo</span>
              <span style={{ color:'var(--gold-light)', fontWeight:700, fontSize:11 }}>{Math.round((1 - fClase) * 100)}% menos</span>
            </div>
            <div style={{ height:5, background:'rgba(255,255,255,0.08)', borderRadius:999, overflow:'hidden' }}>
              <div style={{ height:'100%', borderRadius:999, background:'linear-gradient(90deg,#C49A14,#E8C040)', width:`${(1 - fClase) * 100}%`, transition:'width .4s ease' }}/>
            </div>
          </div>
        </div>

        {/* Botón Modelos Recomendados */}
        <button className="btn-gold">🛒 Ver modelos recomendados →</button>
      </div>
    </div>
  );
};

/* ══════════════════════════════════════════════════════════
   TAB 4 — HOGAR IA (COMPLETO CON TELEMETRÍA, MODOS Y FEED)
   ══════════════════════════════════════════════════════════ */
const TabHogar = () => {
  const [toggles, setToggles] = useState({ termo: true, clima: false, filtro: true });
  const [modo, setModo] = useState('ahorro');
  const [luzW, setLuzW] = useState(847);
  const [aguaL, setAguaL] = useState(8.2);

  useEffect(() => {
    const t = setInterval(() => {
      setLuzW(v => Math.max(600, Math.min(1300, Math.round(v + (Math.random() - 0.47) * 60))));
      setAguaL(v => Math.max(0, Math.min(16, parseFloat((v + (Math.random() - 0.5) * 1.2).toFixed(1)))));
    }, 2200);
    return () => clearInterval(t);
  }, []);

  const modos = [
    { id:'ahorro', l:'Ahorro Agresivo', e:'💰', c:'#C49A14' },
    { id:'confort', l:'Confort Equilibrado', e:'⚖️', c:'#1A237E' },
    { id:'manual', l:'Modo Manual', e:'🎛️', c:'#8b5cf6' },
  ];

  const tipoDot = t => t==='on'?'#10b981':t==='off'?'#64748b':t==='err'?'#ef4444':t==='sun'?'#f59e0b':'#94a3b8';
  const tipoBg  = t => t==='on'?'rgba(16,185,129,0.08)':t==='off'?'rgba(100,116,139,0.06)':t==='err'?'rgba(239,68,68,0.07)':t==='sun'?'rgba(245,158,11,0.08)':'transparent';
  const tipoBrd = t => t==='on'?'rgba(16,185,129,0.25)':t==='off'?'rgba(100,116,139,0.2)':t==='err'?'rgba(239,68,68,0.22)':t==='sun'?'rgba(245,158,11,0.25)':'rgba(255,255,255,0.06)';

  return (
    <div style={{ padding:'16px', display:'flex', flexDirection:'column', gap:14 }} className="fade-in">
      {/* Header */}
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', paddingTop:6 }}>
        <div>
          <h1 style={{ color:'var(--cream)', fontSize:20, fontWeight:700, fontFamily:"'Cinzel',serif", letterSpacing:'.04em' }}>Hogar IA</h1>
          <p style={{ color:'var(--text-muted)', fontSize:11, marginTop:2 }}>Agente autónomo activo</p>
        </div>
        <div style={{ display:'flex', alignItems:'center', gap:6 }}>
          <span style={{ width:8, height:8, background:'var(--gold)', borderRadius:'50%' }} className="pulse"/>
          <span style={{ color:'var(--gold)', fontSize:11, fontWeight:600 }}>En línea</span>
        </div>
      </div>

      {/* Telemetría en Vivo Multi-suministro */}
      <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:8 }}>
        <div style={{ background:'rgba(26,35,126,0.6)', border:'1px solid rgba(196,154,20,0.3)', borderRadius:16, padding:12, textAlign:'center' }}>
          <span style={{ fontSize:22 }}>⚡</span>
          <p style={{ color:'var(--cream)', fontSize:18, fontWeight:800, margin:'4px 0 1px' }}>{luzW}</p>
          <p style={{ color:'var(--text-muted)', fontSize:9.5 }}>W · Luz actual</p>
          <div style={{ height:3, background:'rgba(255,255,255,0.08)', borderRadius:999, marginTop:8, overflow:'hidden' }}>
            <div style={{ height:'100%', background:'var(--gold)', borderRadius:999, width:`${(luzW/1300)*100}%`, transition:'width 1s ease' }}/>
          </div>
        </div>

        <div style={{ background:'rgba(14,116,144,0.15)', border:'1px solid rgba(6,182,212,0.25)', borderRadius:16, padding:12, textAlign:'center' }}>
          <span style={{ fontSize:22 }}>💧</span>
          <p style={{ color:'var(--cream)', fontSize:18, fontWeight:800, margin:'4px 0 1px' }}>{aguaL}</p>
          <p style={{ color:'var(--text-muted)', fontSize:9.5 }}>L/min · Agua</p>
          <span style={{ fontSize:9, background:'rgba(16,185,129,0.15)', color:'#34d399', padding:'2px 7px', borderRadius:999, display:'inline-block', marginTop:6, fontWeight:600 }}>Sin fugas</span>
        </div>

        <div style={{ background:'rgba(124,45,18,0.15)', border:'1px solid rgba(249,115,22,0.25)', borderRadius:16, padding:12, textAlign:'center' }}>
          <span style={{ fontSize:22 }}>🔥</span>
          <p style={{ color:'var(--cream)', fontSize:18, fontWeight:800, margin:'4px 0 1px' }}>1.8</p>
          <p style={{ color:'var(--text-muted)', fontSize:9.5 }}>m³ · Gas</p>
          <span style={{ fontSize:9, background:'rgba(249,115,22,0.15)', color:'#fdba74', padding:'2px 7px', borderRadius:999, display:'inline-block', marginTop:6, fontWeight:600 }}>21.5°C</span>
        </div>
      </div>

      {/* Control de Enchufes Inteligentes */}
      <div className="card" style={{ display:'flex', flexDirection:'column', gap:14 }}>
        <p style={{ color:'var(--cream)', fontSize:13, fontWeight:600 }}>Control de enchufes inteligentes</p>
        {[
          { k:'termo', e:'🚿', n:'Termo eléctrico', sub:'Agua caliente · 1500W', state:'58°C · En hora valle' },
          { k:'clima', e:'❄️', n:'Climatizador salón', sub:'Aire acondicionado · 2200W', state:'Pausado para evitar punta' },
          { k:'filtro', e:'🌊', n:'Filtro depuradora', sub:'Bomba piscina · 750W', state:'Encendido programado' },
        ].map(item => (
          <div key={item.k} style={{ display:'flex', alignItems:'center', gap:12 }}>
            <div style={{ width:40, height:40, background:'var(--bg-card2)', borderRadius:12, display:'flex', alignItems:'center', justifyContent:'center', fontSize:20, flexShrink:0 }}>
              {item.e}
            </div>
            <div style={{ flex:1, minWidth:0 }}>
              <p style={{ color:'var(--cream)', fontSize:12, fontWeight:600 }}>{item.n}</p>
              <p style={{ color:'var(--text-muted)', fontSize:9.5 }}>{item.sub}</p>
              <p style={{ color: toggles[item.k] ? 'var(--gold)' : 'var(--text-muted)', fontSize:10, marginTop:1, fontWeight:500 }}>
                {toggles[item.k] ? item.state : 'Apagado manual'}
              </p>
            </div>
            <div
              className={`toggle ${toggles[item.k] ? 'on' : 'off'}`}
              onClick={() => setToggles(t => ({ ...t, [item.k]: !t[item.k] }))}
              role="switch"
              aria-checked={toggles[item.k]}
            />
          </div>
        ))}
      </div>

      {/* Selector de Modos del Agente IA */}
      <div className="card" style={{ display:'flex', flexDirection:'column', gap:10 }}>
        <p style={{ color:'var(--cream)', fontSize:13, fontWeight:600 }}>Modo del Agente IA</p>
        {modos.map(m => (
          <button
            key={m.id}
            onClick={() => setModo(m.id)}
            style={{
              display:'flex', alignItems:'center', gap:12, padding:'11px 13px', borderRadius:14,
              background: modo === m.id ? `${m.c}12` : 'transparent',
              border: `1px solid ${modo === m.id ? `${m.c}50` : 'rgba(255,255,255,0.05)'}`,
              cursor:'pointer', transition:'all .2s', textAlign:'left', width:'100%'
            }}>
            <span style={{ fontSize:18 }}>{m.e}</span>
            <span style={{ flex:1, fontSize:12.5, fontWeight:500, color: modo === m.id ? (m.id === 'confort' ? '#93c5fd' : m.c) : 'var(--text-muted)' }}>
              {m.l}
            </span>
            {modo === m.id && (
              <div style={{ width:16, height:16, background: m.id === 'confort' ? '#3b82f6' : m.c, borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center' }}>
                <svg width="8" height="8" viewBox="0 0 8 8" fill="none"><path d="M1.5 4l2 2 3-3" stroke="#07091E" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/></svg>
              </div>
            )}
          </button>
        ))}
      </div>

      {/* Feed de Decisiones Autónomas del Agente */}
      <div className="card" style={{ display:'flex', flexDirection:'column', gap:12 }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
          <p style={{ color:'var(--cream)', fontSize:13, fontWeight:600 }}>Decisiones del Agente</p>
          <span style={{ fontSize:10, color:'var(--text-muted)', background:'var(--bg-card2)', padding:'2px 8px', borderRadius:999 }}>{feedIA.length} hoy</span>
        </div>
        {feedIA.map((item, i) => (
          <div key={i} style={{ background:tipoBg(item.tipo), border:`1px solid ${tipoBrd(item.tipo)}`, borderRadius:12, padding:'10px 12px', display:'flex', gap:10 }}>
            <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:4, flexShrink:0, paddingTop:2 }}>
              <div style={{ width:8, height:8, borderRadius:'50%', background:tipoDot(item.tipo) }}/>
              {i < feedIA.length - 1 && <div style={{ width:1, flex:1, background:'rgba(255,255,255,0.08)', minHeight:16 }}/>}
            </div>
            <div style={{ flex:1 }}>
              <div style={{ display:'flex', justifyContent:'space-between', gap:8 }}>
                <p style={{ color:'var(--cream)', fontSize:11.5, fontWeight:600, lineHeight:1.3 }}>{item.a}</p>
                {item.s > 0 && <span style={{ color:'var(--gold-light)', fontSize:10.5, fontWeight:700, flexShrink:0 }}>+{item.s.toFixed(2)}€</span>}
              </div>
              <p style={{ color:'var(--text-muted)', fontSize:10.5, lineHeight:1.5, marginTop:2 }}>{item.r}</p>
              <p style={{ color:tipoDot(item.tipo), fontSize:10, marginTop:4, fontWeight:500 }}>{item.t}</p>
            </div>
          </div>
        ))}

        {/* Resumen de Ahorro IA */}
        <div style={{ background:'var(--gold-dim)', border:'1px solid var(--gold-border)', borderRadius:14, padding:12, display:'flex', justifyContent:'space-between', alignItems:'center' }}>
          <div>
            <p style={{ color:'var(--text-muted)', fontSize:10 }}>Ahorro generado por IA hoy</p>
            <p style={{ color:'var(--gold-light)', fontSize:22, fontWeight:800 }}>1.31 €</p>
          </div>
          <div style={{ textAlign:'right' }}>
            <p style={{ color:'var(--text-muted)', fontSize:10 }}>Este mes acumulado</p>
            <p style={{ color:'var(--cream)', fontSize:18, fontWeight:800 }}>28.40 €</p>
          </div>
        </div>
      </div>
    </div>
  );
};

/* ══════════════════════════════════════════════════════════
   APP SHELL
   ══════════════════════════════════════════════════════════ */
const App = () => {
  const [tab, setTab] = useState('horas');
  const now = new Date();
  const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  const navItems = [
    { id:'factura', e:'📄', l:'Mi Factura' },
    { id:'horas', e:'🕐', l:'Horas' },
    { id:'electro', e:'🔌', l:'Electro G' },
    { id:'hogar', e:'🏠', l:'Hogar IA' },
  ];

  return (
    <div className="phone">
      {/* Status Bar */}
      <div className="status-bar">
        <span style={{ color:'var(--cream)', fontSize:12, fontWeight:600 }}>{timeStr}</span>
        <div style={{ width:112, height:20, background:'#000', borderRadius:10 }}/>
        <div style={{ display:'flex', alignItems:'center', gap:6 }}>
          <span style={{ color:'var(--cream)', fontSize:10 }}>5G</span>
          <div style={{ width:18, height:9, border:'1px solid var(--cream)', borderRadius:2.5, padding:1 }}>
            <div style={{ width:'75%', height:'100%', background:'var(--cream)' }}/>
          </div>
        </div>
      </div>

      {/* Header Superior ARGO */}
      <div style={{ padding:'10px 16px', display:'flex', justifyContent:'space-between', alignItems:'center', background:'rgba(7,9,30,0.9)', backdropFilter:'blur(16px)', borderBottom:'1px solid rgba(196,154,20,0.1)', flexShrink:0 }}>
          <div style={{ display:'flex', alignItems:'center', gap:10 }}>
            <img 
              src="logo-ecovolt.png" 
              alt="ARGO EcoVolt" 
              style={{ width: 38, height: 38, borderRadius: 10, objectFit: 'cover' }} 
            />
            <div>
              <p style={{ color:'var(--gold-light)', fontSize:11, fontWeight:700, fontFamily:"'Cinzel',serif", letterSpacing:'.15em' }}>ECOVOLT</p>
              <p style={{ color:'var(--text-muted)', fontSize:9 }}>by ARGO</p>
            </div>
          </div>
        <div style={{ display:'flex', alignItems:'center', gap:8 }}>
          <div style={{ width:28, height:28, background:'var(--gold-dim)', borderRadius:8, display:'flex', alignItems:'center', justifyContent:'center', fontSize:13 }}>🔔</div>
          <div style={{ width:28, height:28, borderRadius:'50%', background:'linear-gradient(135deg,#C49A14,#1A237E)', display:'flex', alignItems:'center', justifyContent:'center' }}>
            <span style={{ color:'var(--cream)', fontSize:11, fontWeight:700 }}>JM</span>
          </div>
        </div>
      </div>

      {/* Pantalla activa */}
      <div className="screen">
        {tab === 'factura' && <TabFactura />}
        {tab === 'horas' && <TabHorasBaratas />}
        {tab === 'electro' && <TabElectro />}
        {tab === 'hogar' && <TabHogar />}
      </div>

      {/* Barra de Navegación Inferior */}
      <div className="bottom-nav">
        {navItems.map(item => (
          <div key={item.id} className={`nav-item ${tab === item.id ? 'active' : ''}`} onClick={() => setTab(item.id)}>
            <span className="nav-icon">{item.e}</span>
            <span className="nav-label">{item.l}</span>
          </div>
        ))}
      </div>
    </div>
  );
};

const container = document.getElementById('root');
const root = ReactDOM.createRoot(container);
root.render(<App />);
</script>
</body>
</html>
